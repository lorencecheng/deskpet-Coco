<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:;">
  <title>DeskPet Coco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pet">
    <img id="petImg" draggable="false" alt="咖啡猫">
    <div id="bubble"></div>
    <div id="indicator"></div>
    <!-- 状态面板（默认隐藏）：饱食 / 清洁 / 精力 / 心情 -->
    <div id="needsPanel" hidden>
      <div class="need-row"><span>🍝 饱食</span><div class="bar"><i id="need-hunger"></i></div></div>
      <div class="need-row"><span>🛁 清洁</span><div class="bar"><i id="need-clean"></i></div></div>
      <div class="need-row"><span>😴 精力</span><div class="bar"><i id="need-energy"></i></div></div>
      <div class="need-row"><span>🎈 心情</span><div class="bar"><i id="need-mood"></i></div></div>
    </div>
    <!-- 右键动作菜单（默认隐藏） -->
    <div id="menu" hidden>
      <button data-action="status">📊 状态</button>
      <button data-action="walk">🚶 桌面巡游</button>
      <button data-action="happy">😺 说嗨</button>
      <button data-action="drink">☕ 喝咖啡</button>
      <button data-action="feed">🍝 喂宽面</button>
      <button data-action="yarn">🧶 玩毛线球</button>
      <button data-action="chase">🐱 追光标</button>
      <button data-action="bath">🛁 洗澡</button>
      <button data-action="fishing">🎣 钓鱼</button>
      <button data-action="scratch">🐾 抓痒</button>
      <button data-action="sleep">😴 睡觉</button>
      <button data-action="skin">🎨 皮肤工坊</button>
      <button data-action="quit">🚪 退出</button>
    </div>
    <!-- 皮肤工坊面板（默认隐藏） -->
    <div id="skinPanel" hidden>
      <div class="skin-title">🎨 皮肤工坊</div>
      <div class="skin-presets">
        <button data-skin="orange">🟠 橘猫</button>
        <button data-skin="black">⚫ 黑猫</button>
        <button data-skin="white">⚪ 白猫</button>
        <button data-skin="blue">🔵 蓝灰</button>
        <button data-skin="cream">🟡 奶油</button>
        <button data-skin="calico">🌸 三花</button>
        <button data-skin="mine">❤️ 我的配色</button>
      </div>
      <div class="skin-row"><span>毛色</span><input type="color" id="skinFur" value="#f6a64b"></div>
      <div class="skin-row"><span>腮红</span><input type="color" id="skinCheek" value="#ffb3b3"></div>
      <div class="skin-row">
        <button id="skinRandom">🎲 随机配色</button>
        <button id="skinDefault">↩ 恢复橘猫</button>
      </div>
      <div class="skin-row"><span>配色码</span><input id="skinCode" readonly>
        <button id="skinExport">复制</button><button id="skinImport">粘贴</button></div>
      <div class="skin-hint">把配色码发给朋友，对方「粘贴」就能得到同款猫咪~</div>
      <button id="skinClose">完成 ✔</button>
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
